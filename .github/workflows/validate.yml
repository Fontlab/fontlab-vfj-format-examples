# this_file: .github/workflows/validate.yml
name: Validate VFJ corpus

on:
  push:
    paths:
      - "corpus/**/*.vfj"
      - "fontlab-vfj-file-format-spec/**"
      - "scripts/**"
      - "tests/**"
      - "subsets/**"
      - "validate.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "vfj-files.txt"
      - "feature-coverage.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "corpus/**/*.vfj"
      - "fontlab-vfj-file-format-spec/**"
      - "scripts/**"
      - "tests/**"
      - "subsets/**"
      - "validate.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "vfj-files.txt"
      - "feature-coverage.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  integrity:
    name: Corpus integrity + generated-manifest freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout examples
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Manifests are current
        run: |
          uv run python scripts/generate_file_list.py --check
          uv run python scripts/generate_coverage_report.py --output /tmp/coverage.json
          diff -u feature-coverage.json /tmp/coverage.json
          uv run python scripts/generate_corpus_index.py --check

      - name: Corpus integrity tests (schema-independent)
        run: uv run pytest tests/test_corpus_integrity.py

  schema:
    name: Strict schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout examples
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout private VFJ spec when token is available
        if: ${{ secrets.SPEC_REPO_TOKEN != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Fontlab/fontlab-vfj-file-format-spec
          token: ${{ secrets.SPEC_REPO_TOKEN }}
          path: fontlab-vfj-file-format-spec

      - name: Set up uv
        if: ${{ secrets.SPEC_REPO_TOKEN != '' }}
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ secrets.SPEC_REPO_TOKEN != '' }}
        run: uv sync

      - name: Validate strict corpus
        if: ${{ secrets.SPEC_REPO_TOKEN != '' }}
        env:
          VFJ_SCHEMA: fontlab-vfj-file-format-spec/schema/vfj.bundle.schema.json
        run: uv run python validate.py

      - name: Skip validation without private schema access
        if: ${{ secrets.SPEC_REPO_TOKEN == '' }}
        run: |
          echo "SPEC_REPO_TOKEN is not configured; strict schema validation is skipped."
          echo "Set SPEC_REPO_TOKEN to enable CI validation against fontlab-vfj-file-format-spec."
